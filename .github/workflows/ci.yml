name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install . build twine mypy==1.13.0 "fastapi>=0.110,<1" "httpx>=0.27,<1"
      - run: python -m unittest discover -s . -p 'test_*.py'
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - run: python -m mypy --strict --follow-imports=silent pushary_plugin/approval_ledger.py pushary_plugin/cancellation.py pushary_plugin/desktop_answers.py pushary_plugin/desktop_contract.py
      - run: python -m build
      - run: python -m twine check dist/*
  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.2.18'
      - run: npm install --no-save --no-package-lock typescript@5.9.3 react@19.3.0 react-dom@19.3.0 @types/react@19.3.0 @types/react-dom@19.3.0
      - run: node scripts/build-desktop.mjs --check
      - run: node node_modules/typescript/bin/tsc -p desktop-src/tsconfig.json
      - run: bun test desktop-src/plugin.test.ts
