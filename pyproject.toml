[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-plugin-pushary"
version = "0.5.3"
description = "Pushary push notifications plugin for Hermes Agent"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "RalphNex OU", email = "business@pushary.com"}]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]

[project.urls]
Homepage = "https://pushary.com"
Repository = "https://github.com/Pushary/hermes-plugin-pushary"
Issues = "https://github.com/Pushary/hermes-plugin-pushary/issues"

[project.entry-points."hermes_agent.plugins"]
pushary = "pushary_plugin"

[tool.setuptools.packages.find]
where = ["."]
include = ["pushary_plugin*"]

[tool.setuptools.package-data]
"pushary_plugin" = ["plugin.yaml", "skills/*/*.md", "skills/**/*.md"]
